name: Guardián de rutas sensibles

# En cada PR, si se tocan rutas que gobiernan al bot autónomo, su correa o su
# cadena de verificación, etiqueta el PR con `permissions-change` y deja un aviso
# prominente para que la revisión humana no lo pase por alto.
#
# NO bloquea (no falla el check): el bloqueo real lo hacen CODEOWNERS + la
# protección de rama (ver docs/autonomous.md). Este job es la señal de
# visibilidad que convierte la autodeclaración del límite 1 en algo mecánico.
#
# Usa `pull_request_target` A PROPÓSITO: así corre la versión de este guardián
# que está en `main` (un PR no puede neutralizarlo desde su propia rama) y tiene
# permiso de escritura para etiquetar incluso PRs desde forks. SEGURIDAD: este
# job NO hace checkout ni ejecuta el código del PR — solo lista nombres de
# ficheros por API y aplica una etiqueta, así que no hay riesgo de RCE.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write # crear/aplicar etiquetas

concurrency:
  group: guard-sensitive-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flag:
    name: Marcar cambios en rutas sensibles
    if: vars.CI_RUNNER != 'cenit-runners'
    runs-on: ubuntu-latest
    steps:
      - &marcar
        name: Detectar rutas sensibles y etiquetar
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        # Con curl y jq, que traen tanto ubuntu-latest como la imagen de CI de los runners propios (allí no hay `gh`).
        # Sin checkout: la API REST no necesita contexto git local. No bloqueante por diseño.
        run: |
          set -euo pipefail
          api() {
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          # Incluye previous_filename: un RENAME de una ruta sensible reporta
          # solo la ruta nueva en .filename — sin esto, mover el mandato, la CI
          # o el motor escaparía al guardián. Páginas de 100 hasta la primera incompleta.
          files=""
          pagina=1
          while :; do
            lote="$(api "$GITHUB_API_URL/repos/$REPO/pulls/$PR/files?per_page=100&page=$pagina")"
            files="$files$(printf '%s' "$lote" | jq -r '.[] | .filename, (.previous_filename // empty)')"$'\n'
            [ "$(printf '%s' "$lote" | jq length)" -eq 100 ] || break
            pagina=$((pagina + 1))
          done
          sensitive="$(printf '%s\n' "$files" | grep -E '^(\.github/workflows/|\.github/AUTONOMOUS\.md$|\.github/CODEOWNERS$|docs/autonomous\.md$|\.harness/.*\.(mjs|js|cjs|ts)$|\.claude/)' || true)"
          if [ -z "$sensitive" ]; then
            echo "Sin rutas sensibles tocadas en este PR."
            echo "- Sin rutas sensibles en este PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=Cambio en rutas sensibles::Este PR toca workflows/permisos o la cadena de verificación del arnés. Requiere revisión reforzada (límite 1 de .github/AUTONOMOUS.md)."
          {
            echo "## ⚠️ Rutas sensibles modificadas"
            echo ""
            echo "Este PR toca ficheros que gobiernan al bot autónomo, su correa o su cadena de verificación. Revísalo con especial atención (límite 1 de \`.github/AUTONOMOUS.md\`):"
            echo ""
            printf '%s\n' "$sensitive" | while IFS= read -r f; do echo "- $f"; done
          } >> "$GITHUB_STEP_SUMMARY"
          # Crea la etiqueta, o la actualiza si ya existe (lo que hacía `gh label create --force`).
          etiqueta='{"name":"permissions-change","color":"b60205","description":"El PR toca workflow/permisos/motor de verificación: requiere revisión reforzada"}'
          api -X POST "$GITHUB_API_URL/repos/$REPO/labels" -d "$etiqueta" >/dev/null 2>&1 \
            || api -X PATCH "$GITHUB_API_URL/repos/$REPO/labels/permissions-change" -d "$etiqueta" >/dev/null 2>&1 || true
          api -X POST "$GITHUB_API_URL/repos/$REPO/issues/$PR/labels" -d '{"labels":["permissions-change"]}' >/dev/null \
            || echo "::warning::No se pudo aplicar la etiqueta permissions-change; revísalo manualmente."
          exit 0

  # Gemelo en los runners propios (cuando vars.CI_RUNNER = cenit-runners, como harness-ci e imagen): sin él, con el cupo de
  # Actions agotado, este check salía en rojo en todos los PR («recent account payments have failed…»). ARC en modo
  # kubernetes exige `container:`; la imagen de CI de la organización trae curl y jq.
  flag-propio:
    name: Marcar cambios en rutas sensibles (runners propios)
    if: vars.CI_RUNNER == 'cenit-runners'
    runs-on: cenit-runners
    timeout-minutes: 10
    container:
      image: ghcr.io/cenit-digital/ci-infraestructura:sha-600eae5c25c73ff9dc3cc49f4682c6b86ffd398b@sha256:2f9b4cf23a708541bb2a30ceb485ff64effdc5e2b265c35ac8dea84d5c9e945c
    steps:
      - *marcar
